[package]
name = "pilottrack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
icalendar = { version = "0.17.13", features = ["chrono-tz", "time"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["blocking", "native-tls"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
